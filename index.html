<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Scanner</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #00d2ff; --record: #ff3b3b; --bg: #050505; }
        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center;
        }

        /* Abstract Glow Background */
        .glow {
            position: absolute; width: 250px; height: 250px;
            background: radial-gradient(circle, var(--primary), transparent 70%);
            filter: blur(60px); opacity: 0.15; z-index: -1; animation: float 6s infinite alternate;
        }
        @keyframes float { from { transform: translate(-20%, -10%); } to { transform: translate(20%, 10%); } }

        .container { text-align: center; width: 85%; max-width: 400px; z-index: 10; }
        .loc-label { font-size: 0.7rem; letter-spacing: 5px; color: var(--primary); text-transform: uppercase; margin-bottom: 10px; }
        h1 { font-weight: 200; font-size: 2.2rem; margin: 0 0 40px 0; }

        /* Audio Player Styling */
        audio { width: 100%; filter: invert(1); margin-bottom: 20px; }

        /* Action Buttons */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 20px; border-radius: 20px; font-weight: bold;
            backdrop-filter: blur(10px); cursor: pointer; transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .btn.recording { background: var(--record); border-color: var(--record); animation: pulse-red 1.5s infinite; }
        
        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* Cheat Sheet Drawer */
        #codes-drawer {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 80%;
            background: #111; border-top: 1px solid var(--primary);
            border-radius: 30px 30px 0 0; padding: 30px; box-sizing: border-box;
            transition: 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1); overflow-y: auto; z-index: 100;
        }
        #codes-drawer.open { bottom: 0; }
        .code-line { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; font-size: 0.9rem; }
        .code-num { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <div class="loc-label">Rutherford County</div>
        <h1>Dispatch</h1>

        <audio id="scanner-audio" crossorigin="anonymous" controls src="https://broadcastify.cdnstream1.com/31838"></audio>

        <div class="btn-group">
            <button class="btn" id="record-btn" onclick="toggleRecording()">🎤 RECORD</button>
            <button class="btn" onclick="toggleCodes()">📜 CODES</button>
        </div>
        
        <p id="status-msg" style="font-size: 0.7rem; margin-top: 20px; color: #555;">READY TO STREAM</p>
    </div>

    <div id="codes-drawer">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0">10-Codes</h2>
            <button onclick="toggleCodes()" style="background:none; border:none; color:white; font-size: 1.5rem;">✕</button>
        </div>
        <div class="code-line"><span class="code-num">10-4</span> <span>OK / Acknowledged</span></div>
        <div class="code-line"><span class="code-num">10-7</span> <span>Out of Service</span></div>
        <div class="code-line"><span class="code-num">10-8</span> <span>In Service</span></div>
        <div class="code-line"><span class="code-num">10-20</span> <span>Location</span></div>
        <div class="code-line"><span class="code-num">10-33</span> <span>Emergency / Help</span></div>
        <div class="code-line"><span class="code-num">10-50</span> <span>Accident</span></div>
        <div class="code-line"><span class="code-num">10-61</span> <span>Traffic Stop</span></div>
        <div class="code-line"><span class="code-num">Signal 4</span> <span>Structure Fire</span></div>
        <div class="code-line"><span class="code-num">Signal 9</span> <span>Vehicle Fire</span></div>
    </div>

    <script>
        // Drawer Toggle
        function toggleCodes() {
            document.getElementById('codes-drawer').classList.toggle('open');
        }

        // Recording Logic
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function toggleRecording() {
            const btn = document.getElementById('record-btn');
            const status = document.getElementById('status-msg');
            const audioEl = document.getElementById('scanner-audio');

            if (!isRecording) {
                // START RECORDING
                try {
                    const stream = audioEl.captureStream ? audioEl.captureStream() : audioEl.mozCaptureStream();
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = saveRecording;
                    
                    audioChunks = [];
                    mediaRecorder.start();
                    isRecording = true;
                    btn.innerText = "🛑 STOP";
                    btn.classList.add('recording');
                    status.innerText = "RECORDING LIVE AUDIO...";
                } catch (e) {
                    alert("Recording error: Make sure audio is playing first.");
                }
            } else {
                // STOP RECORDING
                mediaRecorder.stop();
                isRecording = false;
                btn.innerText = "🎤 RECORD";
                btn.classList.remove('recording');
                status.innerText = "RECORDING SAVED";
            }
        }

        function saveRecording() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
            const audioUrl = URL.createObjectURL(audioBlob);
            const link = document.createElement('a');
            link.href = audioUrl;
            link.download = `Scanner-Recording-${Date.now()}.mp3`;
            link.click();
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
