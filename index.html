<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Scanner</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <style>
        :root { --primary: #00d2ff; --bg: #0f0f12; }
        body {
            margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: white;
            display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }
        .blob {
            position: absolute; width: 300px; height: 300px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            filter: blur(80px); border-radius: 50%; z-index: -1; opacity: 0.2;
            animation: pulse 8s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.3); } }
        .glass-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px;
            padding: 40px; text-align: center; width: 80%; max-width: 350px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .loc-tag { color: var(--primary); font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 10px; }
        h1 { font-weight: 200; font-size: 1.8rem; margin: 0 0 20px 0; letter-spacing: -1px; }
        .status { font-size: 0.8rem; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; }
        audio { width: 100%; filter: invert(1); opacity: 0.8; }
        .towns { font-size: 0.65rem; color: rgba(255,255,255,0.3); margin-top: 30px; letter-spacing: 1px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="blob"></div>
    <div class="glass-card">
        <div class="loc-tag">Rutherford County</div>
        <h1>Public Safety</h1>
        <div class="status"><div class="dot"></div> LIVE FEED</div>
        <audio controls src="https://broadcastify.cdnstream1.com/31838"></audio>
        <div class="towns">FOREST CITY • SPINDALE • RUTHERFORDTON<br>BOSTIC • ELLENBORO • CLIFFSIDE</div>
    </div>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
